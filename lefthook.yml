pre-commit:
  parallel: true
  jobs:
    - name: lint
      run: pnpm biome check --write --no-errors-on-unmatched --files-ignore-unknown=true {staged_files}
      glob: "*.{ts,tsx,js,jsx,json,jsonc,css}"
      stage_fixed: true

    - name: typecheck
      run: pnpm run type-check


pre-push:
  parallel: true
  jobs:
    # - name: unit-tests
    #   run: pnpm run test

    - name: e2e-tests
      run: pnpm run test:e2e
